name: Pull request checks

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate mock catalog
        run: npm run data:mock
      - name: Validate mock catalog
        run: npm run data:validate
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Ensure generated files are committed
        run: git diff --exit-code

